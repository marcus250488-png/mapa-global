name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Versão fixada: os plugins de notificação e de segundo plano foram escolhidos para ela.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      - name: Gerar projeto Android (só se a pasta não existir)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.monitorglobal --project-name monitor_global .
            rm -f test/widget_test.dart
          fi

      - name: Ajustar manifesto e Gradle
        run: python3 tools/patch_android.py

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-global-apk
          path: build/app/outputs/flutter-apk/app-release.apk
